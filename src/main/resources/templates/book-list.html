<!DOCTYPE html>
<html>
<head>
    <title>Book List</title>
</head>
<body>
    <h1>Book List</h1>

    <ul>
        <li th:each="book : ${books}">
            <span th:text="${book.id}"></span> -
            <span th:text="${book.title}"></span> -
            <span th:text="${book.author}"></span>
        </li>
    </ul>
</body>
</html>
