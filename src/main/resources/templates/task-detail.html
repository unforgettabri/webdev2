<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Details</title>
</head>
<body>
    <h1>Task Details</h1>

    <p><strong>ID:</strong> <span th:text="${task.id}"></span></p>
    <p><strong>Title:</strong> <span th:text="${task.title}"></span></p>
    <p><strong>Description:</strong>
        <span th:text="${task.description ?: 'No description'}"></span>
    </p>
    <p><strong>Status:</strong>
        <span th:text="${task.completed ? 'Completed' : 'Pending'}"></span>
    </p>

    <a th:href="@{/tasks}">Back to Tasks</a>
</body>
</html>
