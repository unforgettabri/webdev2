<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
</head>
<body>
    <h1>Task Tracker</h1>

    <a th:href="@{/tasks/new}">Create New Task</a>

    <p th:if="${#lists.isEmpty(tasks)}">No tasks yet.</p>

    <ul>
        <li th:each="task : ${tasks}">
            <a th:href="@{/tasks/{id}(id=${task.id})}"
               th:text="${task.title}"></a>
            <span th:text="${task.completed ? 'Completed' : 'Pending'}"></span>
        </li>
    </ul>
</body>
</html>
